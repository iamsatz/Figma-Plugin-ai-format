<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restructure</title>
    <style>:root {
  color-scheme: light dark;
  --bg: var(--figma-color-bg, #ffffff);
  --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-hover: var(--figma-color-bg-hover, #e8e8e8);
  --text: var(--figma-color-text, #1e1e1e);
  --text-secondary: var(--figma-color-text-secondary, #666666);
  --border: var(--figma-color-border, #e6e6e6);
  --accent: var(--figma-color-bg-brand, #0d99ff);
  --accent-text: var(--figma-color-text-onbrand, #ffffff);
  --danger: var(--figma-color-text-danger, #e03e3e);
  /* No Figma token for success; define light/dark explicitly. */
  --success: #1b8a4e;
  --badge-amber: #b36b00;
}

@media (prefers-color-scheme: dark) {
  :root {
    --success: #34c77b;
    --badge-amber: #e8920a;
  }
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 12px;
  color: var(--text);
  background: var(--bg);
}

/* ── Layout shell ─────────────────────────────── */

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header .logo {
  width: 20px;
  height: 20px;
  display: inline-flex;
}

.header h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tabs button {
  flex: 1;
  appearance: none;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-secondary);
  padding: 10px 12px;
  font: inherit;
  cursor: pointer;
}

.tabs button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.tabs button.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.tabs button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* The panel area scrolls; the footer is sticky. */
.panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Shared: buttons ──────────────────────────── */

button.primary,
button.secondary {
  appearance: none;
  border-radius: 6px;
  padding: 7px 12px;
  font: inherit;
  cursor: pointer;
  border: 1px solid transparent;
}

button.primary:focus-visible,
button.secondary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button.primary {
  background: var(--accent);
  color: var(--accent-text);
}

button.primary:disabled,
button.secondary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

button.secondary {
  background: var(--bg-secondary);
  color: var(--text);
  border-color: var(--border);
}

button.link {
  appearance: none;
  background: transparent;
  border: none;
  color: var(--accent);
  padding: 0;
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
}

button.link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Shared: form fields ──────────────────────── */

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 10px;
}

.field label {
  font-weight: 500;
  color: var(--text);
}

.field.inactive {
  opacity: 0.55;
}

.field.inactive input {
  background: var(--bg);
}

.hint {
  color: var(--text-secondary);
  font-size: 11px;
}

.field input,
.field textarea,
.field select {
  font: inherit;
  color: var(--text);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
}

.field select {
  appearance: none;
  padding-right: 28px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='currentColor' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 10px 6px;
}

.field input:focus-visible,
.field textarea:focus-visible,
.field select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}

.field textarea {
  min-height: 72px;
  font-family: 'SFMono-Regular', Menlo, monospace;
  resize: vertical;
}

.field .error {
  color: var(--danger);
  font-size: 11px;
}

.actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

/* ── Shared: utility ──────────────────────────── */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11px;
  opacity: 0.9;
  pointer-events: none;
}

.banner {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 12px;
  color: var(--text-secondary);
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 32px 16px;
  text-align: center;
  color: var(--text-secondary);
}

.empty h2 {
  margin: 0;
  font-size: 14px;
  color: var(--text);
}

.error-box {
  margin: 12px 16px;
  padding: 10px 12px;
  border: 1px solid var(--danger);
  border-radius: 6px;
  color: var(--danger);
  /* color-mix has wide Chromium support; --bg is the fallback bg */
  background: color-mix(in srgb, var(--danger) 8%, var(--bg));
}

.error-box p {
  margin: 4px 0 0;
  color: var(--text);
}

/* ── Main panel layout ────────────────────────── */

.main-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* top controls: scope + scan button */
.scope-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.scope-fieldset {
  flex: 1;
  border: none;
  padding: 0;
  margin: 0;
  display: flex;
  gap: 0;
}

.scope-option {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-right: none;
  cursor: pointer;
  font: inherit;
  color: var(--text-secondary);
  background: var(--bg);
  transition: background 0.1s;
}

.scope-option:first-child {
  border-radius: 6px 0 0 6px;
}

.scope-option:last-child {
  border-right: 1px solid var(--border);
  border-radius: 0 6px 6px 0;
}

.scope-option.active {
  background: var(--bg-secondary);
  color: var(--text);
}

.scope-option input[type="radio"] {
  display: none;
}

.hint-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.hint-bar-label {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
}

.hint-bar-select {
  flex: 1;
  font: inherit;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
}

.hint-bar-select:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* scan meta: count + stats row */
.scan-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.scan-meta-count {
  font-weight: 600;
  font-size: 12px;
}

/* fix list scrollable area */
.fix-list-container {
  flex: 1;
  overflow-y: auto;
}

.fix-list {
  padding: 0;
}

/* ── Fix groups ───────────────────────────────── */

.fix-group {
  border-bottom: 1px solid var(--border);
}

.fix-group-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg);
  border: none;
  font: inherit;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.fix-group-header:hover {
  background: var(--bg-hover);
}

.fix-group-header:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.chevron {
  font-size: 10px;
  color: var(--text-secondary);
  width: 12px;
  flex-shrink: 0;
}

.group-label {
  flex: 1;
}

.group-count {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
}

/* ── Fix items ────────────────────────────────── */

.fix-group-items {
  list-style: none;
  margin: 0;
  padding: 0;
}

.fix-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 6px 28px;
  cursor: pointer;
  border: none;
  background: transparent;
}

.fix-item:hover {
  background: var(--bg-hover);
}

.fix-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.fix-item input[type="checkbox"] {
  flex-shrink: 0;
  accent-color: var(--accent);
  cursor: pointer;
  width: 13px;
  height: 13px;
}

.fix-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}

/* ── Confidence badges ────────────────────────── */

.badge {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 4px;
  text-transform: capitalize;
  white-space: nowrap;
}

.badge-high {
  background: color-mix(in srgb, var(--success) 18%, var(--bg));
  color: var(--success);
}

.badge-medium {
  background: color-mix(in srgb, var(--badge-amber) 18%, var(--bg));
  color: var(--badge-amber);
}

.badge-review {
  background: color-mix(in srgb, var(--danger) 14%, var(--bg));
  color: var(--danger);
}

/* ── Action footer ────────────────────────────── */

.action-footer {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

/* ── Naming progress bar ──────────────────────── */

.naming-bar {
  padding: 8px 16px;
  font-size: 11px;
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.naming-bar.warning {
  color: var(--badge-amber);
  background: color-mix(in srgb, var(--badge-amber) 14%, var(--bg));
}

/* ── Footer hint + discard ────────────────────── */

.footer-hint {
  margin: 0;
  padding: 4px 16px 8px;
  font-size: 11px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.discard-link {
  margin-left: auto;
  color: var(--text-secondary);
}

/* ── Applied / post-apply state ───────────────── */

.scan-summary {
  padding: 16px;
}

.scan-summary h3 {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 600;
}

.scan-summary.applied h3 {
  color: var(--success);
}

/* ── Scan skeleton ────────────────────────────── */

@keyframes shimmer {
  0%   { background-position: -100% 0; }
  100% { background-position:  100% 0; }
}

.scan-skeleton {
  padding: 8px 0;
}

.skeleton-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 28px;
}

.skeleton-check,
.skeleton-label,
.skeleton-badge {
  border-radius: 4px;
  background: linear-gradient(
    90deg,
    var(--bg-secondary) 25%,
    var(--bg-hover) 50%,
    var(--bg-secondary) 75%
  );
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

.skeleton-check  { width: 13px; height: 13px; flex-shrink: 0; }
.skeleton-label  { height: 11px; flex: 1; }
.skeleton-badge  { width: 36px; height: 16px; flex-shrink: 0; }

/* ── Renames-pending placeholder ─────────────── */

.fix-item-placeholder {
  padding: 6px 16px 6px 28px;
  font-size: 11px;
  color: var(--text-secondary);
  font-style: italic;
  list-style: none;
}

/* ── Audit-view (post-apply) ──────────────────── */

.fix-item--applied { opacity: 1; }
.fix-item--failed  { opacity: 0.7; }
.fix-item--skipped { opacity: 0.6; }

.fix-status-icon {
  flex-shrink: 0;
  width: 13px;
  height: 13px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.fix-status-icon--applied { color: var(--success); }
.fix-status-icon--failed  { color: var(--danger); }
.fix-status-icon--skipped { color: var(--text-secondary); }

.applied-count { color: var(--success); }
.failed-count  { color: var(--danger); }

/* ── Icons panel ──────────────────────────────── */

.icons-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.icons-search {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.icons-search input {
  flex: 1;
  font: inherit;
  color: var(--text);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
}

.icons-search input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}

.icons-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
}

.icons-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.icon-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 6px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font: inherit;
  color: var(--text);
  transition: background 0.1s, border-color 0.1s;
  min-height: 72px;
}

.icon-card.skeleton {
  pointer-events: none;
  transition: none;
}

.icon-card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
}

.icon-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-card.skeleton {
  cursor: default;
  background: linear-gradient(
    90deg,
    var(--bg-secondary) 25%,
    var(--bg-hover) 50%,
    var(--bg-secondary) 75%
  );
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

.icon-preview {
  width: 32px;
  height: 32px;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-preview svg {
  width: 100%;
  height: 100%;
  display: block;
}

.icon-name {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: center;
  word-break: break-word;
  line-height: 1.25;
}

.icon-source {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  opacity: 0.65;
  margin-top: 1px;
}


/* ── Token usage bar ──────────────────────────── */

.token-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 16px;
  background: var(--bg-secondary);
  font-size: 11px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.token-bar-label {
  flex: 1;
}

.token-bar-value {
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-weight: 500;
}

.token-bar-reset {
  appearance: none;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font: inherit;
  cursor: pointer;
  padding: 0 4px;
  text-decoration: underline;
}

.token-bar-reset:hover {
  color: var(--text);
}

.token-bar-reset:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* ── Settings panel ───────────────────────────── */

.settings-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 4px;
}

.settings-section {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  overflow: hidden;
}

.settings-section-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--bg);
  border: none;
  font: inherit;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.settings-section-header:hover {
  background: var(--bg-hover);
}

.settings-section-header:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.settings-section-title {
  flex: 1;
}

.settings-section-status {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: 999px;
  white-space: nowrap;
}

.settings-section-status--ok {
  background: color-mix(in srgb, var(--success) 18%, var(--bg));
  color: var(--success);
}

.settings-section-status--warn {
  background: color-mix(in srgb, var(--badge-amber) 20%, var(--bg));
  color: var(--badge-amber);
}

.settings-section-body {
  padding: 10px 10px 2px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
}

.settings-section-body .field:last-child {
  margin-bottom: 8px;
}
